<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WarioWare AI</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #111;
            color: white;
            padding: 25px 15px;
        }

        h1 {
            font-size: 45px;
        }

        #challenge {
            font-size: 28px;
            margin: 25px 0;
        }

        #timer,
        #score,
        #lives,
        #level {
            font-size: 22px;
            margin: 10px;
        }

        #gameArea {
            position: relative;
            width: 90%;
            max-width: 700px;
            height: 350px;
            margin: 30px auto;
            border: 3px solid white;
            border-radius: 15px;
            background: #222;
            overflow: hidden;
        }

        #startButton {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
        }

        #target {
            display: none;
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 30px;
            padding: 0;
            border: none;
            cursor: pointer;
        }

        #dangerGame {
            display: none;
            padding: 30px;
        }

        .safeButton,
        .dangerButton {
            padding: 18px 25px;
            margin: 10px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .safeButton {
            background: white;
            color: black;
        }

        .dangerButton {
            background: red;
            color: white;
        }

    </style>

</head>

<body>

    <h1>🎮 WarioWare AI</h1>

    <p id="challenge">
        Welcome to the mini-game challenge!
    </p>

    <p id="timer">
        ⏱️ Time: 15
    </p>

    <p id="score">
        🏆 Score: 0
    </p>

    <p id="lives">
        ❤️ Lives: 3
    </p>

    <p id="level">
        ⭐ Level: 1
    </p>

    <button id="startButton">
        START GAME
    </button>


    <div id="gameArea">

        <!-- GAME 1 -->

        <button id="target">
            🎯
        </button>


        <!-- GAME 2 -->

        <div id="dangerGame">

            <button class="safeButton">
                🟢 SAFE
            </button>

            <button class="safeButton">
                🟢 SAFE
            </button>

            <button class="dangerButton">
                🔴 DANGER
            </button>

            <button class="safeButton">
                🟢 SAFE
            </button>

        </div>

    </div>


    <script>

        // GAME VARIABLES

        let timeLeft = 15;

        let score = 0;

        let lives = 3;

        let level = 1;

        let gameRunning = false;

        let currentGame = 0;

        let gameTimer;

        let moveTimer;


        // HTML ELEMENTS

        const challenge =
            document.getElementById("challenge");

        const timer =
            document.getElementById("timer");

        const scoreDisplay =
            document.getElementById("score");

        const livesDisplay =
            document.getElementById("lives");

        const levelDisplay =
            document.getElementById("level");

        const startButton =
            document.getElementById("startButton");

        const target =
            document.getElementById("target");

        const dangerGame =
            document.getElementById("dangerGame");

        const gameArea =
            document.getElementById("gameArea");

        const safeButtons =
            document.querySelectorAll(".safeButton");

        const dangerButton =
            document.querySelector(".dangerButton");


        // MOVE TARGET

        function moveTarget() {

            const maxX =
                gameArea.clientWidth -
                target.offsetWidth;

            const maxY =
                gameArea.clientHeight -
                target.offsetHeight;

            const randomX =
                Math.floor(Math.random() * maxX);

            const randomY =
                Math.floor(Math.random() * maxY);

            target.style.left =
                randomX + "px";

            target.style.top =
                randomY + "px";
        }


        // HIDE ALL MINI-GAMES

        function hideGames() {

            target.style.display =
                "none";

            dangerGame.style.display =
                "none";
        }


        // START GAME

        startButton.addEventListener(
            "click",
            function () {

                if (gameRunning) {
                    return;
                }


                // RESET

                timeLeft = 15;

                score = 0;

                lives = 3;

                level = 1;

                gameRunning = true;


                scoreDisplay.textContent =
                    "🏆 Score: 0";

                livesDisplay.textContent =
                    "❤️ Lives: 3";

                levelDisplay.textContent =
                    "⭐ Level: 1";

                timer.textContent =
                    "⏱️ Time: 15";


                startButton.textContent =
                    "GAME RUNNING...";


                clearInterval(gameTimer);

                clearInterval(moveTimer);


                // RANDOM MINI-GAME

                currentGame =
                    Math.floor(Math.random() * 2) + 1;


                hideGames();


                // GAME 1

                if (currentGame === 1) {

                    challenge.textContent =
                        "🎯 CLICK THE TARGET!";

                    target.style.display =
                        "block";

                    moveTarget();


                    moveTimer =
                        setInterval(
                            function () {

                                if (gameRunning) {
                                    moveTarget();
                                }

                            },
                            700
                        );
                }


                // GAME 2

                if (currentGame === 2) {

                    challenge.textContent =
                        "🚨 DON'T CLICK THE RED BUTTON!";

                    dangerGame.style.display =
                        "block";
                }


                // TIMER

                gameTimer =
                    setInterval(
                        function () {

                            timeLeft--;

                            timer.textContent =
                                "⏱️ Time: " +
                                timeLeft;


                            if (timeLeft <= 0) {

                                endGame(
                                    "💥 TIME'S UP! SCORE: " +
                                    score
                                );

                            }

                        },
                        1000
                    );

            }
        );


        // GAME 1 TARGET CLICK

        target.addEventListener(
            "click",
            function () {

                if (!gameRunning ||
                    currentGame !== 1) {
                    return;
                }


                score += 100;


                scoreDisplay.textContent =
                    "🏆 Score: " +
                    score;


                challenge.textContent =
                    "🔥 NICE! +100";


                moveTarget();

            }
        );


        // GAME 2 SAFE BUTTON

        safeButtons.forEach(
            function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        if (!gameRunning ||
                            currentGame !== 2) {
                            return;
                        }


                        score += 100;


                        scoreDisplay.textContent =
                            "🏆 Score: " +
                            score;


                        challenge.textContent =
                            "🟢 SAFE! +100";


                        button.style.visibility =
                            "hidden";


                        setTimeout(
                            function () {

                                button.style.visibility =
                                    "visible";

                            },
                            300
                        );

                    }
                );

            }
        );


        // GAME 2 DANGER BUTTON

        dangerButton.addEventListener(
            "click",
            function () {

                if (!gameRunning ||
                    currentGame !== 2) {
                    return;
                }


                lives--;


                livesDisplay.textContent =
                    "❤️ Lives: " +
                    lives;


                challenge.textContent =
                    "💥 OH NO! DANGER!";


                if (lives <= 0) {

                    endGame(
                        "💀 GAME OVER! SCORE: " +
                        score
                    );

                }

            }
        );


        // END GAME

        function endGame(message) {

            clearInterval(gameTimer);

            clearInterval(moveTimer);

            gameRunning = false;

            hideGames();

            challenge.textContent =
                message;

            startButton.textContent =
                "PLAY AGAIN";

        }

    </script>

</body>

</html>
