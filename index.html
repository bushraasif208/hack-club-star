.logo {

.startButton {
    margin-top: 25px;

.stat {
    text-align: center;

.stat small {
    display: block;
    color: #aaa;

.stat strong {
    font-size: 22px;

#combo {
    color: #ff45dc;
}

#arena {

#timerBar {

}

#timerFill {
    width: 100%;

    background: #ff39d7;

}

#content {

.choice {

}

.choice:hover {

}

.choice:active {
    transform: scale(.95);
}

.imposterGrid {
    display: grid;
    grid-template-columns: repeat(5, 65px);
    gap: 10px;
}

.imposter {
    width: 65px;
    height: 65px;

    border-radius: 15px;
    background: #191020;
    font-size: 30px;
}

.reactionButton {
    width: 230px;
    height: 130px;
    border: 0;
    border-radius: 30px;
    background: #24182d;

.memoryGrid {

.dangerZone {

    position: relative;
}

.movingDot {
    width: 45px;

    background: #51ff8c;
    position: absolute;
}

.glam {
    font-size: 35px;
}

#aiMessage {
    position: absolute;
    bottom: 20px;
    left: 20px;
    max-width: 400px;
    color: #bcaecb;
    font-size: 14px;
    font-weight: 700;
}

/* ================= COUNTDOWN ================= */

#countdown {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(5,0,10,.92);
    font-size: clamp(80px, 20vw, 180px);
    font-weight: 1000;
}

/* ================= RESULT FLASH ================= */

#flash {
    position: fixed;
    inset: 0;
    z-index: 40;
    pointer-events: none;
    display: none;
    justify-content: center;
    align-items: center;
    font-size: clamp(50px, 12vw, 120px);
    font-weight: 1000;
}

/* ================= GAME OVER ================= */

#gameOver {
    display: none;
    min-height: 100vh;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.overBox {
    width: min(650px, 90%);
    padding: 40px;
    border-radius: 30px;
    background: rgba(10,5,25,.8);
}

.finalScore {
    font-size: 75px;
    font-weight: 1000;
    color: #ff39d7;
}

.restart {
    padding: 16px 35px;
    border: 0;
    border-radius: 40px;
    font-size: 19px;
    font-weight: 900;
}

@media(max-width:600px) {
    .imposterGrid {
        grid-template-columns: repeat(4, 55px);

    .imposter {

        height: 55px;
    }

    .choice {
        min-width: 100px;
        font-size: 16px;
    }

    #aiMessage {
        display: none;
    }
}
