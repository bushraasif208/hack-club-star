      color: #ff4d4d;

    .arena {
      min-height: 500px;

      overflow: hidden;
      cursor: default;
    }

    .message {
      text-align: center;

      display: none;

<body>

  <!-- HOME -->

  <div id="home">

    <div class="logo">WARIOWARE</div>

    <div class="subtitle">AI MICROGAME CHAOS</div>

    <button onclick="startGame()">
      START CHAOS
    </button>

  </div>


  <!-- ARCADE -->

  <div id="arcade">

    <div class="topbar">

      <div class="score">
        SCORE: <span id="score">0000</span>
      </div>

      <div>
        ROUND: 1
      </div>

      <div class="lives">
        ♥ ♥ ♥
      </div>

    </div>


    <div class="arena" id="arena">

      <div class="timer" id="timer">
        3
      </div>

      <div class="message" id="message">

        <h1>GET READY!</h1>

        <p>Prepare yourself...</p>

      </div>


      <button id="reactionButton">
        CLICK!
      </button>


      <div id="result">

        <h1 id="resultTitle"></h1>

        <p id="resultText"></p>

      </div>

    </div>

  </div>


<script>

let score = 0;

let reactionStart = 0;

let gameTimer;


function startGame() {

  document.getElementById("home").style.display = "none";

  document.getElementById("arcade").style.display = "block";

  startReaction();

}


function startReaction() {

  const message = document.getElementById("message");

  const button = document.getElementById("reactionButton");

  const result = document.getElementById("result");

  const timer = document.getElementById("timer");


  message.style.display = "block";

  button.style.display = "none";

  result.style.display = "none";


  message.innerHTML = `

    <h1>WAIT...</h1>

    <p>Don't click yet.</p>

  `;


  timer.innerText = "3";


  setTimeout(() => {

    timer.innerText = "2";

  }, 700);


  setTimeout(() => {

    timer.innerText = "1";

  }, 1400);


  setTimeout(() => {

    timer.innerText = "";

    message.innerHTML = `

      <h1>⚡ NOW!</h1>

      <p>CLICK AS FAST AS POSSIBLE!</p>

    `;


    button.style.display = "block";

    reactionStart = performance.now();


    gameTimer = setTimeout(() => {

      button.style.display = "none";

      showResult(false, 0);

    }, 1500);

  }, 2100);

}


document.getElementById("reactionButton").onclick = function() {

  clearTimeout(gameTimer);


  const reactionTime = Math.round(

    performance.now() - reactionStart

  );


  button = document.getElementById("reactionButton");

  button.style.display = "none";


  showResult(true, reactionTime);

};


function showResult(success, reactionTime) {

  const message = document.getElementById("message");

  const result = document.getElementById("result");

  const title = document.getElementById("resultTitle");

  const text = document.getElementById("resultText");


  message.style.display = "none";

  result.style.display = "block";


  if (success) {

    const points = Math.max(

      100,

      1000 - reactionTime

    );


    score += points;


    document.getElementById("score").innerText =

      String(score).padStart(4, "0");


    title.innerText = "🔥 NICE!";

    text.innerText =

      reactionTime + " ms — +" + points + " points";


  } else {

    title.innerText = "💀 TOO SLOW!";

    text.innerText = "You missed the window.";


  }


  setTimeout(() => {

    startReaction();

  }, 1800);

}

</script>

</body>
</html>
