<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WarioWare AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #111;
            color: white;
            padding: 30px 20px;
        }

        h1 {
            font-size: 45px;
        }

        #challenge {
            font-size: 30px;
            margin: 25px 0;
        }

        #timer,
        #score {
            font-size: 24px;
            margin: 15px;
        }

        #gameArea {
            position: relative;
            width: 90%;
            max-width: 700px;
            height: 350px;
            margin: 30px auto;
            border: 3px solid white;
            border-radius: 15px;
            background: #222;
            overflow: hidden;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
        }

        #target {
            display: none;
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 30px;
            padding: 0;
        }
    </style>
</head>

<body>

    <h1>🎮 WarioWare AI</h1>

    <p id="challenge">Welcome to the mini-game challenge!</p>

    <p id="timer">⏱️ Time: 5</p>

    <p id="score">🏆 Score: 0</p>

    <button id="startButton">START GAME</button>

    <div id="gameArea">
        <button id="target">🎯</button>
    </div>

    <script>

        let timeLeft = 5;
        let score = 0;
        let gameTimer;
        let gameRunning = false;

        const challenge = document.getElementById("challenge");
        const timer = document.getElementById("timer");
        const scoreDisplay = document.getElementById("score");
        const startButton = document.getElementById("startButton");
        const target = document.getElementById("target");
        const gameArea = document.getElementById("gameArea");

        function moveTarget() {

            const maxX = gameArea.clientWidth - target.offsetWidth;
            const maxY = gameArea.clientHeight - target.offsetHeight;

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            target.style.left = randomX + "px";
            target.style.top = randomY + "px";
        }

        startButton.addEventListener("click", function () {

            if (gameRunning) {
                return;
            }

            timeLeft = 5;
            score = 0;
            gameRunning = true;

            scoreDisplay.textContent = "🏆 Score: 0";
            timer.textContent = "⏱️ Time: 5";

            challenge.textContent =
                "🎯 CLICK THE TARGET!";

            startButton.textContent =
                "GAME RUNNING...";

            target.style.display = "block";

            moveTarget();

            clearInterval(gameTimer);

            gameTimer = setInterval(function () {

                timeLeft--;

                timer.textContent =
                    "⏱️ Time: " + timeLeft;

                if (timeLeft <= 0) {

                    clearInterval(gameTimer);

                    gameRunning = false;

                    target.style.display = "none";

                    challenge.textContent =
                        "💥 TIME'S UP! FINAL SCORE: " + score;

                    startButton.textContent =
                        "PLAY AGAIN";
                }

            }, 1000);

        });

        target.addEventListener("click", function () {

            if (!gameRunning) {
                return;
            }

            score += 100;

            scoreDisplay.textContent =
                "🏆 Score: " + score;

            challenge.textContent =
                "🔥 NICE! +100";

            moveTarget();

        });

    </script>

</body>
</html>
