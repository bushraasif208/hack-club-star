<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WarioWare AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #111;
            color: white;
            padding: 25px 15px;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 10px;
        }

        #subtitle {
            color: #ccc;
            font-size: 20px;
        }

        /* MENU */

        #menu {
            max-width: 750px;
            margin: 40px auto;
        }

        .gameButton {
            width: 90%;
            max-width: 600px;
            margin: 15px auto;
            padding: 25px;

            display: block;

            font-size: 24px;
            font-weight: bold;

            border: 3px solid white;
            border-radius: 15px;

            background: #222;
            color: white;

            cursor: pointer;

            transition: 0.15s;
        }

        .gameButton:hover {
            transform: scale(1.04);
        }

        .gameDescription {
            display: block;
            margin-top: 8px;

            font-size: 16px;
            font-weight: normal;

            color: #ccc;
        }

        /* GAME SCREEN */

        #gameScreen {
            display: none;
        }

        #challenge {
            font-size: 30px;
            margin: 25px 0;
        }

        #timer,
        #score,
        #lives {
            font-size: 21px;
            margin: 8px;
        }

        #gameArea {
            position: relative;

            width: 90%;
            max-width: 700px;
            min-height: 350px;

            margin: 30px auto;

            border: 3px solid white;
            border-radius: 15px;

            background: #222;

            overflow: hidden;
        }

        /* GAME 1 */

        #target {
            display: none;

            position: absolute;

            width: 70px;
            height: 70px;

            border-radius: 50%;

            border: none;

            font-size: 30px;

            cursor: pointer;
        }

        /* GAME 2 */

        #dangerGame {
            display: none;
            padding: 60px 10px;
        }

        .safeButton,
        .dangerButton {
            padding: 18px 25px;

            margin: 10px;

            font-size: 20px;

            border: none;
            border-radius: 10px;

            cursor: pointer;
        }

        .safeButton {
            background: white;
            color: black;
        }

        .dangerButton {
            background: red;
            color: white;
        }

        /* GAME 3 */

        #memoryGame {
            display: none;

            padding: 30px 10px;
        }

        #pattern {
            font-size: 45px;

            min-height: 70px;

            margin: 20px;
        }

        #memoryMessage {
            font-size: 20px;

            min-height: 30px;
        }

        #memoryButtons {
            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 12px;

            max-width: 500px;

            margin: 25px auto;
        }

        .memoryButton {
            width: 80px;
            height: 80px;

            font-size: 35px;

            border: 3px solid white;

            border-radius: 15px;

            background: #333;

            color: white;

            cursor: pointer;
        }

        .memoryButton:hover {
            transform: scale(1.08);
        }

        /* BACK */

        #backButton {
            margin-top: 20px;

            padding: 12px 25px;

            font-size: 18px;

            border: none;

            border-radius: 10px;

            cursor: pointer;
        }

    </style>

</head>


<body>


    <!-- ========================= -->
    <!-- GAME SELECTION MENU -->
    <!-- ========================= -->

    <div id="menu">

        <h1>🎮 WarioWare AI</h1>

        <p id="subtitle">
            Choose your mini-game!
        </p>


        <button class="gameButton" id="game1Button">

            🎯 GAME 1

            <span class="gameDescription">
                Catch the moving target!
            </span>

        </button>


        <button class="gameButton" id="game2Button">

            🚨 GAME 2

            <span class="gameDescription">
                Don't click the red button!
            </span>

        </button>


        <button class="gameButton" id="game3Button">

            🧠 GAME 3

            <span class="gameDescription">
                Copy the pattern from memory!
            </span>

        </button>

    </div>



    <!-- ========================= -->
    <!-- GAME SCREEN -->
    <!-- ========================= -->

    <div id="gameScreen">

        <h1>🎮 WarioWare AI</h1>


        <p id="challenge">
            Challenge
        </p>


        <p id="timer">
            ⏱️ Time: 15
        </p>


        <p id="score">
            🏆 Score: 0
        </p>


        <p id="lives">
            ❤️ Lives: 3
        </p>



        <div id="gameArea">


            <!-- ================= -->
            <!-- GAME 1 -->
            <!-- ================= -->

            <button id="target">
                🎯
            </button>



            <!-- ================= -->
            <!-- GAME 2 -->
            <!-- ================= -->

            <div id="dangerGame">

                <button class="safeButton">
                    🟢 SAFE
                </button>

                <button class="safeButton">
                    🟢 SAFE
                </button>

                <button class="dangerButton">
                    🔴 DANGER
                </button>

                <button class="safeButton">
                    🟢 SAFE
                </button>

            </div>



            <!-- ================= -->
            <!-- GAME 3 -->
            <!-- ================= -->

            <div id="memoryGame">

                <h2>🧠 Remember the pattern!</h2>

                <div id="pattern">
                    👀
                </div>

                <p id="memoryMessage">
                    Watch carefully...
                </p>


                <div id="memoryButtons">

                    <button class="memoryButton" data-symbol="🔴">
                        🔴
                    </button>

                    <button class="memoryButton" data-symbol="🔵">
                        🔵
                    </button>

                    <button class="memoryButton" data-symbol="🟢">
                        🟢
                    </button>

                    <button class="memoryButton" data-symbol="🟡">
                        🟡
                    </button>

                </div>

            </div>


        </div>



        <button id="backButton">
            ⬅️ Back to Games
        </button>

    </div>



    <script>


        /* =========================
           GAME VARIABLES
        ========================= */

        let timeLeft = 15;

        let score = 0;

        let lives = 3;

        let currentGame = 0;

        let gameRunning = false;

        let gameTimer;

        let moveTimer;


        /* GAME 3 VARIABLES */

        let memoryPattern = [];

        let playerPattern = [];

        let memoryRound = 1;



        /* =========================
           ELEMENTS
        ========================= */

        const menu =
            document.getElementById("menu");

        const gameScreen =
            document.getElementById("gameScreen");


        const game1Button =
            document.getElementById("game1Button");

        const game2Button =
            document.getElementById("game2Button");

        const game3Button =
            document.getElementById("game3Button");


        const challenge =
            document.getElementById("challenge");

        const timer =
            document.getElementById("timer");

        const scoreDisplay =
            document.getElementById("score");

        const livesDisplay =
            document.getElementById("lives");


        const gameArea =
            document.getElementById("gameArea");


        const target =
            document.getElementById("target");


        const dangerGame =
            document.getElementById("dangerGame");


        const memoryGame =
            document.getElementById("memoryGame");


        const patternDisplay =
            document.getElementById("pattern");


        const memoryMessage =
            document.getElementById("memoryMessage");


        const memoryButtons =
            document.querySelectorAll(".memoryButton");


        const backButton =
            document.getElementById("backButton");



        /* =========================
           HIDE GAMES
        ========================= */

        function hideGames() {

            target.style.display =
                "none";

            dangerGame.style.display =
                "none";

            memoryGame.style.display =
                "none";

        }



        /* =========================
           MOVE TARGET
        ========================= */

        function moveTarget() {

            const maxX =
                gameArea.clientWidth -
                target.offsetWidth;

            const maxY =
                gameArea.clientHeight -
                target.offsetHeight;

            const randomX =
                Math.floor(
                    Math.random() * maxX
                );

            const randomY =
                Math.floor(
                    Math.random() * maxY
                );


            target.style.left =
                randomX + "px";

            target.style.top =
                randomY + "px";

        }



        /* =========================
           START GAME
        ========================= */

        function startGame(gameNumber) {


            clearInterval(gameTimer);

            clearInterval(moveTimer);


            timeLeft = 15;

            score = 0;

            lives = 3;

            currentGame =
                gameNumber;

            gameRunning = true;


            menu.style.display =
                "none";

            gameScreen.style.display =
                "block";


            scoreDisplay.textContent =
                "🏆 Score: 0";

            livesDisplay.textContent =
                "❤️ Lives: 3";

            timer.textContent =
                "⏱️ Time: 15";


            hideGames();



            /* =====================
               GAME 1
            ===================== */

            if (currentGame === 1) {

                challenge.textContent =
                    "🎯 CLICK THE TARGET!";

                target.style.display =
                    "block";

                moveTarget();


                moveTimer =
                    setInterval(
                        function () {

                            if (gameRunning) {

                                moveTarget();

                            }

                        },
                        700
                    );

            }



            /* =====================
               GAME 2
            ===================== */

            if (currentGame === 2) {

                challenge.textContent =
                    "🚨 DON'T CLICK THE RED BUTTON!";

                dangerGame.style.display =
                    "block";

            }



            /* =====================
               GAME 3
            ===================== */

            if (currentGame === 3) {

                challenge.textContent =
                    "🧠 REMEMBER THE PATTERN!";

                memoryGame.style.display =
                    "block";

                startMemoryGame();

            }



            /* =====================
               TIMER
            ===================== */

            gameTimer =
                setInterval(
                    function () {

                        timeLeft--;

                        timer.textContent =
                            "⏱️ Time: " +
                            timeLeft;


                        if (timeLeft <= 0) {

                            endGame(
                                "💥 TIME'S UP! SCORE: " +
                                score
                            );

                        }

                    },
                    1000
                );

        }



        /* =========================
           GAME 1 BUTTON
        ========================= */

        game1Button.addEventListener(
            "click",
            function () {

                startGame(1);

            }
        );



        /* =========================
           GAME 2 BUTTON
        ========================= */

        game2Button.addEventListener(
            "click",
            function () {

                startGame(2);

            }
        );



        /* =========================
           GAME 3 BUTTON
        ========================= */

        game3Button.addEventListener(
            "click",
            function () {

                startGame(3);

            }
        );



        /* =========================
           GAME 1 CLICK
        ========================= */

        target.addEventListener(
            "click",
            function () {

                if (
                    !gameRunning ||
                    currentGame !== 1
                ) {
                    return;
                }


                score += 100;


                scoreDisplay.textContent =
                    "🏆 Score: " +
                    score;


                challenge.textContent =
                    "🔥 NICE! +100";


                moveTarget();

            }
        );



        /* =========================
           GAME 2 SAFE BUTTONS
        ========================= */

        const safeButtons =
            document.querySelectorAll(
                ".safeButton"
            );


        safeButtons.forEach(
            function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        if (
                            !gameRunning ||
                            currentGame !== 2
                        ) {
                            return;
                        }


                        score += 100;


                        scoreDisplay.textContent =
                            "🏆 Score: " +
                            score;


                        challenge.textContent =
                            "🟢 SAFE! +100";


                        button.style.visibility =
                            "hidden";


                        setTimeout(
                            function () {

                                button.style.visibility =
                                    "visible";

                            },
                            300
                        );

                    }
                );

            }
        );



        /* =========================
           GAME 2 DANGER
        ========================= */

        const dangerButton =
            document.querySelector(
                ".dangerButton"
            );


        dangerButton.addEventListener(
            "click",
            function () {

                if (
                    !gameRunning ||
                    currentGame !== 2
                ) {
                    return;
                }


                lives--;


                livesDisplay.textContent =
                    "❤️ Lives: " +
                    lives;


                challenge.textContent =
                    "💥 OH NO!";


                if (lives <= 0) {

                    endGame(
                        "💀 GAME OVER! SCORE: " +
                        score
                    );

                }

            }
        );



        /* =========================
           GAME 3
           MEMORY GAME
        ========================= */


        function startMemoryGame() {

            memoryPattern = [];

            playerPattern = [];

            memoryRound = 1;


            nextMemoryRound();

        }



        function nextMemoryRound() {

            playerPattern = [];


            const symbols = [
                "🔴",
                "🔵",
                "🟢",
                "🟡"
            ];


            memoryPattern = [];


            const patternLength =
                Math.min(
                    2 + memoryRound,
                    6
                );


            for (
                let i = 0;
                i < patternLength;
                i++
            ) {

                const randomIndex =
                    Math.floor(
                        Math.random() *
                        symbols.length
                    );


                memoryPattern.push(
                    symbols[randomIndex]
                );

            }


            patternDisplay.textContent =
                memoryPattern.join(" ");


            memoryMessage.textContent =
                "👀 Remember it!";


            memoryButtons.forEach(
                function (button) {

                    button.disabled =
                        true;

                }
            );


            setTimeout(
                function () {

                    patternDisplay.textContent =
                        "❓ ❓ ❓";

                    memoryMessage.textContent =
                        "🎯 Now copy it!";


                    memoryButtons.forEach(
                        function (button) {

                            button.disabled =
                                false;

                        }
                    );

                },
                1800
            );

        }



        /* =========================
           MEMORY BUTTON CLICK
        ========================= */

        memoryButtons.forEach(
            function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        if (
                            !gameRunning ||
                            currentGame !== 3
                        ) {
                            return;
                        }


                        const symbol =
                            button.dataset.symbol;


                        playerPattern.push(
                            symbol
                        );


                        const currentIndex =
                            playerPattern.length - 1;


                        /* WRONG */

                        if (
                            symbol !==
                            memoryPattern[currentIndex]
                        ) {

                            lives--;


                            livesDisplay.textContent =
                                "❤️ Lives: " +
                                lives;


                            memoryMessage.textContent =
                                "❌ WRONG!";


                            playerPattern = [];


                            if (lives <= 0) {

                                endGame(
                                    "💀 GAME OVER! SCORE: " +
                                    score
                                );

                                return;

                            }


                            setTimeout(
                                function () {

                                    nextMemoryRound();

                                },
                                800
                            );


                            return;

                        }


                        /* CORRECT SYMBOL */

                        memoryMessage.textContent =
                            "✅ Correct!";


                        /* COMPLETE PATTERN */

                        if (
                            playerPattern.length ===
                            memoryPattern.length
                        ) {

                            const points =
                                memoryPattern.length *
                                100;


                            score += points;


                            scoreDisplay.textContent =
                                "🏆 Score: " +
                                score;


                            memoryMessage.textContent =
                                "🔥 PERFECT! +" +
                                points;


                            memoryRound++;


                            setTimeout(
                                function () {

                                    nextMemoryRound();

                                },
                                800
                            );

                        }

                    }
                );

            }
        );



        /* =========================
           END GAME
        ========================= */

        function endGame(message) {

            clearInterval(gameTimer);

            clearInterval(moveTimer);


            gameRunning = false;


            hideGames();


            challenge.textContent =
                message;

        }



        /* =========================
           BACK TO MENU
        ========================= */

        backButton.addEventListener(
            "click",
            function () {

                clearInterval(gameTimer);

                clearInterval(moveTimer);


                gameRunning = false;


                hideGames();


                gameScreen.style.display =
                    "none";


                menu.style.display =
                    "block";

            }
        );


    </script>

</body>

</html>
